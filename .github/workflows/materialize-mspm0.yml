name: Materialize MSPM0 portfolio

on:
  push:
    branches: [main]
    paths:
      - '.mspm0-payload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct cleaned projects
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 7500 .mspm0-payload/part-000
            cat .mspm0-payload/part-001 .mspm0-payload/part-002 .mspm0-payload/part-003 .mspm0-payload/part-004 .mspm0-payload/part-005 .mspm0-payload/part-006 .mspm0-payload/part-007
          } | base64 -d > /tmp/mspm0-portfolio.tar.xz
          echo "d7d0e335dca5b271f522a0cc154b45855b7292153739152f2b79836a798bc05c  /tmp/mspm0-portfolio.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mspm0-src
          tar -xJf /tmp/mspm0-portfolio.tar.xz -C /tmp/mspm0-src

      - name: Publish project branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branches=(
            A_2020_ping A_2020model C2023final LCD_module OPA_PGA_MODE THD
            ad9959_tuozhan_adc2 apfft_nospace apfft_space duoji_pwm hardwareave lcd_my
          )
          for branch in "${branches[@]}"; do
            git switch "$branch"
            git ls-files -z | xargs -0 -r git rm -f
            cp -a "/tmp/mspm0-src/$branch/." .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "feat(${branch}): publish cleaned portfolio source"
              git push origin "$branch"
            fi
          done

      - name: Clean temporary materializer
        shell: bash
        run: |
          set -euo pipefail
          git switch main
          rm -rf .mspm0-payload
          rm -f .github/workflows/materialize-mspm0.yml
          git add -A
          git commit -m "chore: remove temporary MSPM0 materializer"
          git push origin main
